name: ByteFlow Daily Reel

on:
  schedule:
    # Her sayfa KENDİ kitlesinin en iyi saatinde çıkar (cron → marka eşlemesi aşağıda):
    - cron: '0 18 * * *'    # etiketkodu — 18:00 UTC: koşu ~8dk, yayın ~21:10 TR (TR akşam zirvesi)
    - cron: '20 16 * * *'   # ciltkodu — 16:20 UTC: koşu ~8dk, yayın ~19:30 TR (TR akşam zirvesi)
  workflow_dispatch:
    inputs:
      publish:
        description: "Instagram'a yayınla (kapatırsan sadece render + push, test için)"
        type: boolean
        default: true
      brand:
        description: "Hangi marka (brands/<slug>.json). Boş = tüm markalar."
        type: string
        default: ""
      spec:
        description: "Test: hazır bir spec dosyasını render et (ör. render/fixtures/versus-tr.json)"
        type: string
        default: ""
      voice:
        description: "Seslendirme (ÖNİZLEME için: publish kapalıyken de sesli video üret)"
        type: boolean
        default: false


permissions:
  contents: write   # public/latest.mp4 push
  issues: write     # token expiry uyarısı

jobs:
  post:
    runs-on: ubuntu-latest
    # Onaylı markada iş, karar gelene kadar nöbette bekliyor (üretim ~10 dk + nöbet ~2,8 sa).
    # Onaysız markalarda akış eskisi gibi ~15 dakikada biter.
    timeout-minutes: 300
    strategy:
      # Her marka AYRI koşu: biri düşerse diğeri yayınlanmaya devam eder.
      fail-fast: false
      max-parallel: 1
      matrix:
        # Marka seçimi: elle tetiklemede girdi, zamanlanmışta HANGİ CRON tetiklediyse o marka.
        # YENİ MARKA EKLERKEN: cron ekle + buraya eşle + yayın adımına secret'larını koy.
        brand: ${{ fromJSON(
          inputs.brand != '' && format('["{0}"]', inputs.brand)
          || (github.event.schedule == '20 16 * * *' && '["ciltkodu"]')
          || (github.event.schedule == '0 18 * * *' && '["etiketkodu"]')
          || '["etiketkodu"]') }}
    concurrency:
      group: byteflow-daily-${{ matrix.brand }}
      cancel-in-progress: false
    env:
      BYTEFLOW_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── ONAY KAPISI ────────────────────────────────────────────────────────────
      # Markanın onay kilidi açıksa (brands/<slug>.json → onay.aktif) ve onay kutusunda
      # HÂLÂ karar bekleyen bir video varsa BU KOŞU HİÇBİR ŞEY ÜRETMEZ. Serdar'ın kuralı:
      # "onayda bekleyen video olduğu sürece sonraki video öbür gün oluşturulmayacak."
      # Kilit sunucuda da var (onaybox 409 döner); buradaki kontrol 10 dakikalık boş
      # render'ı ve boşa harcanan Gemini/TTS kotasını engelliyor.
      - name: Onay kapısı — bekleyen video var mı?
        id: kapi
        env:
          ONAY_BASE_URL: ${{ secrets.ONAY_BASE_URL }}
          ONAY_INGEST_KEY: ${{ secrets.ONAY_INGEST_KEY }}
        run: |
          ONAY=$(jq -r '.onay.aktif // false' "brands/${BYTEFLOW_BRAND}.json")
          echo "onay=$ONAY" >> "$GITHUB_OUTPUT"
          if [ "$ONAY" != "true" ]; then echo "· bu markada onay kapısı kapalı"; exit 0; fi
          if [ -z "$ONAY_BASE_URL" ] || [ -z "$ONAY_INGEST_KEY" ]; then
            echo "::error::onay.aktif=true ama ONAY_BASE_URL/ONAY_INGEST_KEY secret'ı yok"; exit 1
          fi
          # Video yolu onay akışının da ihtiyacı (tekrar denemede yeniden push ediyor).
          OUT="public/${BYTEFLOW_BRAND}-latest.mp4"
          echo "VIDEO_PATH=$OUT" >> "$GITHUB_ENV"
          DURUM=$(curl -fsS -H "x-onay-key: $ONAY_INGEST_KEY" \
            "$ONAY_BASE_URL/api/durum?marka=$BYTEFLOW_BRAND")
          echo "$DURUM"
          if [ "$(echo "$DURUM" | jq -r '.bekleyenVar')" = "true" ]; then
            echo "bekleyen=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Onayda bekleyen video var → bugün yeni video üretilmiyor, karar nöbetine geçiliyor."
          fi

      # ── GÜNLÜK KOTA ────────────────────────────────────────────────────────────
      # Serdar kuralı: günde EN FAZLA bir yayın. Onay kapısı yalnız "bekleyen varsa üretme"
      # diyordu; kalem onaylanıp yayınlandıktan sonra aynı günün cron'u boş kapı görüp ikinci
      # videoyu üretiyordu (2026-08-02'de iki post aynı gün çıktı). Dünden kalan bugün
      # yayınlandıysa bugünün yeni videosu PAS GEÇİLİR.
      - name: Günlük kota — bugün zaten yayın yapıldı mı?
        id: kota
        run: |
          set +e
          node publish/gunluk-kota.mjs
          KOD=$?
          set -e
          if [ "$KOD" = "10" ]; then
            echo "bekleyen=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Bugün zaten yayın yapıldı → bugünün yeni videosu pas geçildi."
          elif [ "$KOD" != "0" ]; then
            echo "::error::gunluk-kota.mjs beklenmedik çıkış kodu: $KOD"; exit "$KOD"
          fi

      - name: Sistem bağımlılıkları (ffmpeg + fontlar)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb fonts-noto-color-emoji fonts-jetbrains-mono fonts-inter \
            || sudo apt-get install -y ffmpeg xvfb fonts-noto-color-emoji
          fc-list | grep -ci inter || echo "uyarı: Inter kurulamadı, sistem sans'ına düşülecek"

      - name: Bağımlılıklar (root + render + chromium)
        run: |
          npm ci
          cd render
          npm ci
          npx playwright install --with-deps chromium

      - name: Önceki postların insight'larını doldur (best-effort)
        continue-on-error: true
        env:
          # ⚠ HER MARKANIN token'ı burada olmalı. backfill-insights.mjs marka dosyasındaki
          # env ADINI okuyor (brands/<slug>.json → publish.instagram.token). Yalnız
          # IG_ACCESS_TOKEN verildiği için @cilt.kodu'da script sessizce "token yok" deyip
          # çıkıyordu → 2026-08-03'e kadar sayfanın HİÇBİR postunda insight birikmedi ve
          # skor tablosu (sampleSize >= 3 şartı) o sayfa için hiç devreye girmedi.
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOBLE_IG_USER_ID: ${{ secrets.NOBLE_IG_USER_ID }}
          NOBLE_IG_TOKEN: ${{ secrets.NOBLE_IG_TOKEN }}
        run: node publish/backfill-insights.mjs

      # ── HESAP DÜZEYİ ÖLÇÜM ─────────────────────────────────────────────────────
      # ⚠ SIRA ÖNEMLİ: bu adım YAYINDAN ÖNCE koşmalı. Günün anlık görüntüsü "o günkü post
      # yayınlanmadan önceki takipçi sayısı" anlamına geliyor; takipçi atfı (publish/
      # takipci-raporu.mjs) tam olarak bu sözleşmeye yaslanıyor. Adımı yayından sonraya
      # taşırsan rapor bir gün kayar ve sessizce yanlış post'a kredi verir.
      - name: Hesap ölçümü (takipçi anlık görüntüsü)
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOBLE_IG_USER_ID: ${{ secrets.NOBLE_IG_USER_ID }}
          NOBLE_IG_TOKEN: ${{ secrets.NOBLE_IG_TOKEN }}
        run: node publish/hesap-olcum.mjs

      # Ayrı commit: onaylı markada yayın olmayan günlerde (Serdar onaylamadıysa) aşağıdaki
      # yayın-sonrası commit adımı hiç çalışmıyor → o günün takipçi ölçümü kaybolurdu.
      # Takipçi eğrisinde delik olmaması bu adıma bağlı.
      - name: Hesap ölçümünü commit et
        continue-on-error: true
        run: |
          bash publish/repo-push.sh "chore: hesap olcumu $(date -u +%F)" brands/state >/dev/null

      - name: Video üret (trend → Gemini → b-roll → render → kompozit → müzik)
        if: ${{ steps.kapi.outputs.bekleyen != '1' && steps.kota.outputs.bekleyen != '1' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Stok b-roll sağlayıcıları — sırayla denenir, hiçbiri yoksa düz arka plana düşer.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          RENDER_HEADED: '1'   # xvfb sanal ekranı altında headed chromium
          # KOTA KORUMASI: yayınlanmayacak test koşuları seslendirme üretmesin. Ücretsiz TTS
          # kotası günlük; 8-10 test koşusu günün kotasını bitirip GERÇEK yayını sessiz
          # bıraktı (2026-07-27, @cilt.kodu ilk gönderisi). Test = sessiz, yayın = sesli.
          # ÖNİZLEME: yayınlamadan SESLİ video üretebilmek için ayrı bir anahtar. Yoksa
          # publish=false koşusu sessiz video veriyor ve videoyu yayından önce gerçek
          # hâliyle izlemek mümkün olmuyordu (2026-07-28).
          BYTEFLOW_VOICE: ${{ (github.event_name == 'schedule' || inputs.publish || inputs.voice) && '1' || '0' }}
          BYTEFLOW_SPEC: ${{ inputs.spec }}
        run: xvfb-run -a node run-daily.mjs

      - name: Videoyu barındır (repo'ya push)
        if: ${{ steps.kapi.outputs.bekleyen != '1' && steps.kota.outputs.bekleyen != '1' }}
        run: |
          # Marka başına ayrı dosya: iki marka aynı public/latest.mp4'ü ezerse yayınlar karışır.
          # (VIDEO_PATH onay kapısı adımında hesaplanıp GITHUB_ENV'e yazıldı.)
          mkdir -p public && cp dist/final.mp4 "$VIDEO_PATH"
          # Push mantığı publish/repo-push.sh'de: aynı iş onay döngüsünde (tekrar denemede)
          # de gerekiyor, iki kopya tutulmuyor. Son satır = commit SHA.
          # Boru KULLANMA: `... | tail -1` başarısızlığı yutar (pipefail kapalı) ve boş bir
          # SHA ile devam edilir → onay akışı bozuk bir video adresi alır. Komut ikamesi
          # ise `set -e` altında hatayı olduğu gibi düşürür. (Script SHA'yı stdout'a,
          # geri kalan her şeyi stderr'e yazıyor.)
          SHA=$(bash publish/repo-push.sh "chore: daily reel $(date -u +%F)" \
            "$VIDEO_PATH" scene-spec.generated.json render/scene-spec.json \
            posted-history.json brands/state)
          echo "VIDEO_SHA=$SHA" >> "$GITHUB_ENV"

      # ── ONAYLI MARKA: yayın kararı Serdar'ın ────────────────────────────────────
      # Video kuyruğa girer, bildirim gider, bu iş kararı BEKLER (varsayılan ~2,8 saat).
      # "Tekrar dene" gelirse yeni video AYNI koşuda üretilir — bağımlılıklar zaten kurulu,
      # yeniden üretim ~5 dk. Süre dolarsa kalem onayda kalır; nöbetçi cron devralır.
      - name: Onay nöbeti (kuyruğa koy → karar bekle → uygula)
        if: ${{ steps.kapi.outputs.onay == 'true' }}
        timeout-minutes: 240
        env:
          ONAY_BASE_URL: ${{ secrets.ONAY_BASE_URL }}
          ONAY_INGEST_KEY: ${{ secrets.ONAY_INGEST_KEY }}
          ONAY_BEKLEME_DK: ${{ vars.ONAY_BEKLEME_DK || '170' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          RENDER_HEADED: '1'
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NOBLE_IG_USER_ID: ${{ secrets.NOBLE_IG_USER_ID }}
          NOBLE_IG_TOKEN: ${{ secrets.NOBLE_IG_TOKEN }}
          NOBLE_FB_PAGE_ID: ${{ secrets.NOBLE_FB_PAGE_ID }}
        run: |
          URL=""
          if [ "${{ steps.kapi.outputs.bekleyen }}" != "1" ] && [ "${{ steps.kota.outputs.bekleyen }}" != "1" ]; then
            URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VIDEO_SHA}/${VIDEO_PATH}"
          fi
          xvfb-run -a node publish/onay-akisi.mjs $URL

      - name: Instagram + Facebook'a yayınla
        if: ${{ steps.kapi.outputs.onay != 'true' && steps.kota.outputs.bekleyen != '1'
          && (github.event_name == 'schedule' || inputs.publish) }}
        env:
          # Marka dosyası hangi env adını istiyorsa onu okuyor (brands/<slug>.json → publish).
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NOBLE_IG_USER_ID: ${{ secrets.NOBLE_IG_USER_ID }}
          NOBLE_IG_TOKEN: ${{ secrets.NOBLE_IG_TOKEN }}
          NOBLE_FB_PAGE_ID: ${{ secrets.NOBLE_FB_PAGE_ID }}
        run: |
          SHA=$(git rev-parse HEAD)
          node publish/publish-latest.mjs "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/${VIDEO_PATH}"

      - name: mediaId'yi geçmişe commit et
        # Onaylı markada bu işi onay akışı yapıyor (yayın anında) — burada tekrarlanmaz.
        if: ${{ steps.kapi.outputs.onay != 'true' && (github.event_name == 'schedule' || inputs.publish) }}
        continue-on-error: true
        run: |
          # ⚠ brands/state DE eklenmeli: mediaId'yi publish-latest.mjs MARKANIN geçmiş dosyasına
          # yazıyor (brands/state/<marka>-history.json). Yalnız posted-history.json
          # commit'lendiği için @cilt.kodu'nun mediaId'leri her koşuda kayboluyordu → başlık
          # bloklisti (mediaId'si olan kayıtlar) 14 postun 1'ini görüyordu ve konu tekrarı
          # engellenemiyordu (2026-08-01, üst üste iki hyalüronik asit videosu).
          bash publish/repo-push.sh "chore: reel mediaId $(date -u +%F)" \
            posted-history.json brands/state >/dev/null

      - name: Token expiry guard
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node publish/check-token-expiry.mjs
