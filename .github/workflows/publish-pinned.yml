name: Onaylı Reel Yayını (kuyruk)

# "Onayla → sonra yayınla" kuyruğu.
#
# Neden: onaylanan video ile yayın anı aynı olmak zorunda değil. Gece onaylanan bir reel'i
# gece atmak erişimi yakar; günlük otomatik yayınla arka arkaya atmak da iki postu birbirine
# kırdırır. Kuyruk, onaylı sürümü SABİT bir commit'e (immutable raw URL) bağlar ve bir sonraki
# uygun pencerede yayınlar.
#
# Kullanım: publish/pinned.json içine {sha, title} yaz + commit'le. İş bittiğinde workflow
# dosyayı siler → aynı video ikinci kez yayınlanmaz.

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 15:00 TR — byteflow'un günlük yayınından (15:00 UTC)
                            # 3 saat önce; iki post birbirini kırmasın
  workflow_dispatch:

permissions:
  contents: write

# ⚠ Marka AÇIKÇA yazılmalı: bu iş BYTEFLOW_BRAND belirtmiyordu ve varsayılana ('byteflow')
# düşüyordu. byteflow markası 2026-08-03'te emekli edildi (sayfa @kizlar.kodu oldu) — varsayılan
# bırakılsaydı bu cron her gün "marka bulunamadı" ile patlardı.
env:
  BYTEFLOW_BRAND: kizlarkodu

concurrency:
  group: byteflow-pinned
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kuyrukta iş var mı?
        id: check
        run: |
          if [ -f publish/pinned.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            node -e "const p=require('./publish/pinned.json');console.log('kuyrukta:',p.title,p.sha)"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "· kuyruk boş, yapılacak iş yok"
          fi

      - name: Bağımlılıklar
        if: steps.check.outputs.found == 'true'
        run: npm ci

      - name: Onaylı sürümü yayınla
        if: steps.check.outputs.found == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          SHA=$(node -p "require('./publish/pinned.json').sha")
          # Caption/etiket/kapak, videonun üretildiği commit'ten okunur — sonradan değişen
          # spec dosyası yanlış açıklamayla yayınlamasın.
          # checkout@v4 SIĞ klonlar (depth=1): kuyruktaki commit'in ağacı runner'da YOK ve
          # `git show` "exists on disk, but not in <sha>" ile 128 döner (2026-07-28'de yayını
          # düşürdü). fetch-depth: 0 yerine SADECE o commit'i çekiyoruz — repo 189MB (günlük
          # mp4), tam geçmişi indirmenin anlamı yok.
          git fetch --depth=1 origin "$SHA"
          git show "$SHA:scene-spec.generated.json" > /tmp/pinned-spec.json
          node publish/publish-latest.mjs \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/public/latest.mp4" \
            /tmp/pinned-spec.json

      - name: Kuyruğu temizle (tekrar yayın olmasın)
        if: steps.check.outputs.found == 'true'
        run: |
          rm -f publish/pinned.json
          git config user.name "byteflow-bot"
          git config user.email "byteflow-bot@users.noreply.github.com"
          git add -A publish/pinned.json posted-history.json 2>/dev/null || git add -A publish
          git commit -m "chore: kuyruktaki reel yayınlandı" || echo "değişiklik yok"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash origin master || exit 1
            sleep 3
          done
